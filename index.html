<!-- 引入 Firebase SDK (v9/v10 相容 CDN) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
  // 1. Firebase 初始化設定 (請填入你的專案資訊，務必包含 databaseURL)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "tennis-package.firebaseapp.com",
    databaseURL: "https://tennis-package-default-rtdb.firebaseio.com", // ⚠️ 必須要有此行
    projectId: "tennis-package",
    storageBucket: "tennis-package.appspot.com",
    messagingSenderId: "897402153829",
    appId: "1:897402153829:web:18069dae9187cc554cf8c"
  };

  // 初始化 Firebase
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const database = firebase.database();

  // 2. 監聽 Firebase 數據庫連線狀態 (修復手機一直顯示連線中的問題)
  const connectedRef = database.ref(".info/connected");
  connectedRef.on("value", (snap) => {
    const statusElement = document.getElementById("connection-status");
    if (statusElement) {
      if (snap.val() === true) {
        statusElement.innerText = "🟢 已雲端同步";
      } else {
        statusElement.innerText = "🟡 連線中...";
      }
    }
  });

  // 3. 管理者密碼驗證登入邏輯
  function handleAdminLogin() {
    const inputPassword = prompt("請輸入管理者密碼：");
    
    if (inputPassword === null) {
      return; // 使用者點擊取消
    }

    if (inputPassword === "coscourse") {
      alert("登入成功！已開啟管理者權限。");
      // 顯示管理者專用介面或解鎖編輯功能
      document.body.classList.add("admin-mode");
      
      const adminPanel = document.getElementById("admin-panel");
      if (adminPanel) {
        adminPanel.style.display = "block";
      }
    } else {
      alert("密碼錯誤，請重新輸入！");
    }
  }

  // 4. 綁定按鈕點擊事件 (確保點擊按鈕有反應)
  document.addEventListener("DOMContentLoaded", () => {
    const adminBtn = document.getElementById("admin-login-btn");
    if (adminBtn) {
      adminBtn.addEventListener("click", handleAdminLogin);
    }
  });
</script>
