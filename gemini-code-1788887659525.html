<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網球會所套票與課表點名系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎾 網球會所套票與課表點名系統</h1>
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('tab-students')">👨‍🎓 學員與套票預約</button>
            <button class="tab-btn" onclick="switchTab('tab-schedule')">📅 每日課表點名板</button>
        </nav>
    </header>

    <main>
        <!-- 分頁一：學員與預約管理 -->
        <section id="tab-students" class="tab-content active">
            <div class="card">
                <h2>➕ 新增學員與十堂套票</h2>
                <form id="student-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="name">學生姓名：</label>
                            <input type="text" id="name" required placeholder="例如：張小明">
                        </div>
                        <div class="form-group">
                            <label for="phone">電話：</label>
                            <input type="tel" id="phone" placeholder="例如：0912345678">
                        </div>
                        <div class="form-group">
                            <label for="payment">付款狀態：</label>
                            <select id="payment">
                                <option value="已付款">已付款</option>
                                <option value="未付款">未付款</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="total-package">購買堂數：</label>
                            <input type="number" id="total-package" value="10" required min="1">
                        </div>
                    </div>
                    <button type="submit" class="btn primary">建立學員資料</button>
                </form>
            </div>

            <div class="card">
                <div class="list-header">
                    <h2>📋 學員名單與預約紀錄</h2>
                    <input type="text" id="search-student" placeholder="🔍 搜尋學員姓名..." oninput="renderStudents()">
                </div>
                <div id="student-list"></div>
            </div>
        </section>

        <!-- 分頁二：每日時段總覽（點名板） -->
        <section id="tab-schedule" class="tab-content">
            <div class="card">
                <h2>📅 每日班級點名板（僅顯示「已付款」學員）</h2>
                <div class="filter-bar">
                    <div class="form-group">
                        <label for="schedule-date">選擇上課日期：</label>
                        <input type="date" id="schedule-date" onchange="renderSchedule()">
                    </div>
                </div>
                
                <div id="schedule-summary" class="schedule-summary">
                    <!-- 動態繪製該日期的班級時段 -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modal 彈窗：預約與改期 -->
    <div id="booking-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modal-title">預約上課時間</h3>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
